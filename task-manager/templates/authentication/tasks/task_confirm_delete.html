{% extends 'base.html' %}

{% block title %}Delete Task - Task Manager{% endblock %}

{% block extra_css %}
<style>
    .delete-container {
        max-width: 600px;
        margin: 0 auto;
        text-align: center;
    }

    .delete-warning {
        background: #fff3cd;
        border: 2px solid #ffc107;
        border-radius: 10px;
        padding: 2rem;
        margin-bottom: 2rem;
    }

    .delete-warning h2 {
        color: #856404;
        margin-bottom: 1rem;
    }

    .task-being-deleted {
        background: white;
        padding: 1.5rem;
        border-radius: 10px;
        margin: 1rem 0 2rem;
        border-left: 5px solid #dc3545;
    }

    .task-title-preview {
        font-size: 1.3rem;
        font-weight: 700;
        color: #333;
    }

    .warning-message {
        color: #666;
        font-size: 1.1rem;
        margin-bottom: 2rem;
    }

    .delete-actions {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
    }

    .btn-confirm-delete {
        padding: 0.75rem 2rem;
        font-size: 1rem;
        font-weight: 600;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .btn-confirm-delete.danger {
        background: #dc3545;
        color: white;
    }

    .btn-confirm-delete.danger:hover {
        background: #c82333;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(220, 53, 69, 0.4);
    }

    .btn-confirm-delete.cancel {
        background: #6c757d;
        color: white;
        text-decoration: none;
    }

    .btn-confirm-delete.cancel:hover {
        background: #5a6268;
        transform: translateY(-2px);
    }
</style>
{% endblock %}

{% block content %}
<div class="delete-container">
    <div class="delete-warning">
        <h2>⚠️ Confirm Delete</h2>
        
        <div class="task-being-deleted">
            <div class="task-title-preview">{{ task.title }}</div>
        </div>

        <p class="warning-message">
            Are you sure you want to delete this task? This action cannot be undone.
        </p>

        <form method="post" style="display: inline;">
            {% csrf_token %}
            <div class="delete-actions">
                <button type="submit" class="btn-confirm-delete danger">
                    🗑️ Yes, Delete Task
                </button>
                <a href="{% url 'task_detail' task.id %}" class="btn-confirm-delete cancel">
                    ← Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
