{% extends 'base.html' %}

{% block title %}Password Reset Successful - Task Manager{% endblock %}

{% block extra_css %}
<style>
    .success-container {
        max-width: 500px;
        margin: 3rem auto;
        background: white;
        padding: 3rem 2rem;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        text-align: center;
    }

    .success-container h2 {
        color: #28a745;
        margin-bottom: 1.5rem;
        font-size: 1.8rem;
    }

    .success-container p {
        color: #666;
        margin: 1rem 0;
        line-height: 1.6;
        font-size: 1rem;
    }

    .success-icon {
        font-size: 4rem;
        margin-bottom: 1rem;
    }

    .cta-button {
        display: inline-block;
        margin-top: 2rem;
        padding: 0.75rem 2rem;
        background: #667eea;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-weight: 600;
        transition: all 0.3s ease;
    }

    .cta-button:hover {
        background: #5568d3;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
</style>
{% endblock %}

{% block content %}
<div class="success-container">
    <div class="success-icon">✅</div>
    <h2>Password Reset Successful!</h2>
    <p>Your password has been successfully reset.</p>
    <p>You can now login with your new password.</p>
    <a href="{% url 'login' %}" class="cta-button">Go to Login</a>
</div>
{% endblock %}
